<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>RRL — RepatResearchLab</title>
<style>
  :root {
    --bg: #07090f;
    --bg2: #0a0d16;
    --panel: #0f1320;
    --panel2: #141a2b;
    --panel3: #1a2138;
    --tx: #eef2ff;
    --sub: #a8b8d0;
    --mute: #7a8fa8;
    --dim: #4a5d7a;
    --gold: #f5a623;
    --gold-dim: #b8851c;
    --green: #2ed68a;
    --green-dim: #1e9d64;
    --red: #f06060;
    --red-dim: #b04545;
    --blue: #4da8f8;
    --purple: #b87aff;
    --border: rgba(168, 184, 208, 0.15);
    --border-bright: rgba(245, 166, 35, 0.4);
    --grid-line: rgba(168, 184, 208, 0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--tx);
    font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    font-weight: 700;
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%),
      repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(168, 184, 208, 0.015) 2px, rgba(168, 184, 208, 0.015) 4px);
  }
  h1, h2, h3, h4, h5, h6, p, div, span, a, button, input, label, td, th {
    font-weight: 700 !important;
    font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif !important;
  }
  .mono { font-family: "Consolas", "Courier New", monospace !important; letter-spacing: 0.5px; }

  .terminal-bar {
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #000;
    padding: 4px 28px;
    font-size: 11px;
    letter-spacing: 1.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--gold);
  }
  .terminal-bar .left { display: flex; gap: 18px; align-items: center; }
  .terminal-bar .right { display: flex; gap: 14px; align-items: center; }
  .terminal-bar .blink {
    display: inline-block;
    width: 8px; height: 8px;
    background: #000;
    border-radius: 50%;
    animation: blink 1.2s infinite;
    margin-right: 6px;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.2; }
  }

  .container { max-width: 1440px; margin: 0 auto; padding: 20px 28px 50px; }

  .hero {
    border: 1px solid var(--border);
    border-left: 4px solid var(--gold);
    background: linear-gradient(135deg, var(--panel) 0%, var(--bg2) 100%);
    padding: 18px 24px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 50%;
    background: radial-gradient(circle at top right, rgba(245, 166, 35, 0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 24px;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .hero h1 {
    font-size: 36px;
    margin: 0;
    color: var(--gold);
    letter-spacing: 3px;
    font-family: "Consolas", monospace !important;
    text-shadow: 0 0 18px rgba(245, 166, 35, 0.4);
  }
  .hero .subtitle {
    color: var(--sub);
    font-size: 13px;
    margin: 4px 0 0;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .hero-stats {
    display: flex;
    gap: 22px;
  }
  .hero-stat {
    text-align: right;
    border-left: 1px solid var(--border);
    padding-left: 22px;
  }
  .hero-stat .label {
    color: var(--mute);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .hero-stat .num {
    color: var(--tx);
    font-size: 22px;
    font-family: "Consolas", monospace !important;
    line-height: 1.1;
  }
  .hero-stat .num.green { color: var(--green); }
  .hero-stat .num.gold { color: var(--gold); }
  .hero-stat .num.blue { color: var(--blue); }

  .toolbar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    align-items: center;
    margin-bottom: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 10px 14px;
  }
  .search-box { position: relative; }
  .search-box input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--tx);
    font-size: 13px;
    padding: 8px 12px 8px 36px;
    outline: none;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .search-box input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 0 12px rgba(245, 166, 35, 0.15);
  }
  .search-box input::placeholder { color: var(--dim); }
  .search-box::before {
    content: ">_";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-family: "Consolas", monospace;
    font-size: 13px;
  }

  .tag-filters {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .tag-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--sub);
    font-size: 11px;
    padding: 6px 11px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .tag-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(245, 166, 35, 0.05);
  }
  .tag-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
  }

  .stats-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .stat-cell {
    background: var(--panel);
    padding: 10px 14px;
  }
  .stat-cell .lbl {
    color: var(--mute);
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .stat-cell .val {
    color: var(--tx);
    font-size: 17px;
    font-family: "Consolas", monospace !important;
  }
  .stat-cell .val.gold { color: var(--gold); }
  .stat-cell .val.green { color: var(--green); }
  .stat-cell .val.blue { color: var(--blue); }
  .stat-cell .val.purple { color: var(--purple); }

  .stats-line {
    color: var(--mute);
    font-size: 11px;
    margin: 6px 0 14px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stats-line strong { color: var(--gold); font-family: "Consolas", monospace !important; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    min-height: 200px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 30%, rgba(245, 166, 35, 0.2), transparent 70%);
    background-size: 250% 250%;
    background-position: 100% 100%;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 0;
    pointer-events: none;
  }
  .card:hover::before {
    opacity: 1;
    animation: borderFlow 2.5s linear infinite;
  }
  @keyframes borderFlow {
    0% { background-position: 100% 100%; }
    100% { background-position: -100% -100%; }
  }
  .card > * { position: relative; z-index: 2; }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow:
      0 0 0 1px var(--gold),
      0 8px 30px rgba(245, 166, 35, 0.2),
      0 0 50px rgba(245, 166, 35, 0.08);
  }

  .card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 11px;
    letter-spacing: 1px;
  }
  .card .date {
    color: var(--gold);
    font-family: "Consolas", monospace !important;
  }
  .card .ticker-id {
    color: var(--mute);
    font-family: "Consolas", monospace !important;
  }
  .card .title {
    font-size: 16px;
    color: var(--tx);
    margin-bottom: 10px;
    line-height: 1.4;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 8px;
  }
  .card .summary {
    color: var(--sub);
    font-size: 13px;
    line-height: 1.6;
    flex: 1;
    margin-bottom: 10px;
  }
  .card .bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 8px;
  }
  .card .tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .card .tag {
    font-size: 10px;
    padding: 2px 7px;
    background: var(--bg2);
    color: var(--mute);
    border: 1px solid var(--border);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-family: "Consolas", monospace !important;
  }
  .card .tag.dram { color: var(--gold); border-color: var(--gold); background: rgba(245, 166, 35, 0.08); }
  .card .tag.semi { color: var(--blue); border-color: var(--blue); background: rgba(77, 168, 248, 0.08); }
  .card .tag.dcf { color: var(--purple); border-color: var(--purple); background: rgba(184, 122, 255, 0.08); }
  .card .tag.taiwan { color: var(--green); border-color: var(--green); background: rgba(46, 214, 138, 0.08); }
  .card .tag.us { color: var(--red); border-color: var(--red); background: rgba(240, 96, 96, 0.08); }
  .card .tag.macro { color: var(--gold); border-color: var(--gold); background: rgba(245, 166, 35, 0.08); }
  .card .tag.earnings { color: var(--purple); border-color: var(--purple); background: rgba(184, 122, 255, 0.08); }
  .card .tag.ai { color: var(--blue); border-color: var(--blue); background: rgba(77, 168, 248, 0.08); }
  .card .open-arrow {
    color: var(--mute);
    font-family: "Consolas", monospace !important;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
  }
  .card:hover .open-arrow {
    opacity: 1;
    color: var(--gold);
    transform: translateX(3px);
  }

  .empty {
    text-align: center;
    color: var(--mute);
    padding: 50px 20px;
    background: var(--panel);
    border: 1px dashed var(--border);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 12px;
  }

  .footer {
    margin-top: 32px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--mute);
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  .footer .left { display: flex; gap: 14px; }
  .footer .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  @media (max-width: 768px) {
    .hero-grid { grid-template-columns: 1fr; gap: 14px; }
    .hero-stats { justify-content: space-between; }
    .hero-stat { padding-left: 14px; }
    .stats-bar { grid-template-columns: 1fr 1fr; }
    .toolbar { grid-template-columns: 1fr; }
    .terminal-bar { flex-direction: column; gap: 4px; padding: 6px 14px; }
  }
</style>
</head>
<body>

<div class="terminal-bar">
  <div class="left">
    <span><span class="blink"></span>RRL TERMINAL v1.0</span>
    <span class="mono" id="liveTime">--:--:-- TPE</span>
  </div>
</div>

<div class="container">

  <div class="hero">
    <div class="hero-grid">
      <div>
        <h1>RRL</h1>
        <p class="subtitle">RepatResearchLab</p>
      </div>
      <div></div>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="label">Reports</div>
          <div class="num gold mono" id="statReports">--</div>
        </div>
        <div class="hero-stat">
          <div class="label">Tags</div>
          <div class="num blue mono" id="statTags">--</div>
        </div>
        <div class="hero-stat">
          <div class="label">Last Update</div>
          <div class="num green mono" id="statLast">--</div>
        </div>
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-cell">
      <div class="lbl">Total Notes</div>
      <div class="val gold mono" id="kpiTotal">--</div>
    </div>
    <div class="stat-cell">
      <div class="lbl">This Month</div>
      <div class="val green mono" id="kpiMonth">--</div>
    </div>
    <div class="stat-cell">
      <div class="lbl">Active Tags</div>
      <div class="val blue mono" id="kpiTags">--</div>
    </div>
    <div class="stat-cell">
      <div class="lbl">Latest Entry</div>
      <div class="val purple mono" id="kpiLatest">--</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search" placeholder="SEARCH TITLE / SUMMARY / TAG ...">
    </div>
    <div class="tag-filters" id="tagFilters">
      <button class="tag-btn active" data-tag="all">ALL</button>
    </div>
  </div>

  <div class="stats-line" id="stats"></div>

  <div class="grid" id="grid"></div>

  <div class="footer">
    <div class="left">
      <span><span class="dot"></span>SYSTEM ONLINE</span>
      <span>HOSTED ON GITHUB PAGES</span>
      <span>NO ADVISORY · PERSONAL NOTES</span>
    </div>
    <div class="right mono">© 2026 RRL</div>
  </div>

</div>

<script>
let allReports = [];
let activeTag = "all";
let searchKeyword = "";

const tagLabels = {
  dram: "DRAM",
  semi: "SEMI",
  dcf: "DCF",
  taiwan: "TW",
  us: "US",
  ai: "AI",
  earnings: "EARN",
  macro: "MACRO"
};

function updateClock() {
  const now = new Date();
  const tpe = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Taipei" }));
  const t = tpe.toTimeString().split(" ")[0];
  document.getElementById("liveTime").textContent = t + " TPE";
}
setInterval(updateClock, 1000);
updateClock();

async function loadReports() {
  try {
    const resp = await fetch("reports.json");
    const data = await resp.json();
    allReports = data.sort((a, b) => b.date.localeCompare(a.date));
    renderTagFilters();
    renderStats();
    renderGrid();
  } catch (e) {
    document.getElementById("grid").innerHTML =
      '<div class="empty">&gt;&gt; ERROR: CANNOT LOAD reports.json</div>';
  }
}

function renderTagFilters() {
  const allTags = new Set();
  allReports.forEach(r => (r.tags || []).forEach(t => allTags.add(t)));
  const container = document.getElementById("tagFilters");
  [...allTags].sort().forEach(tag => {
    const btn = document.createElement("button");
    btn.className = "tag-btn";
    btn.dataset.tag = tag;
    btn.textContent = tagLabels[tag] || tag.toUpperCase();
    btn.onclick = () => {
      activeTag = tag;
      document.querySelectorAll(".tag-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderGrid();
    };
    container.appendChild(btn);
  });
  document.querySelector('.tag-btn[data-tag="all"]').onclick = () => {
    activeTag = "all";
    document.querySelectorAll(".tag-btn").forEach(b => b.classList.remove("active"));
    document.querySelector('.tag-btn[data-tag="all"]').classList.add("active");
    renderGrid();
  };
}

function renderStats() {
  const total = allReports.length;
  const tagSet = new Set();
  allReports.forEach(r => (r.tags || []).forEach(t => tagSet.add(t)));
  const now = new Date();
  const ym = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const thisMonth = allReports.filter(r => r.date.startsWith(ym)).length;
  const latest = allReports.length ? allReports[0].date : "--";

  document.getElementById("statReports").textContent = String(total).padStart(2, "0");
  document.getElementById("statTags").textContent = String(tagSet.size).padStart(2, "0");
  document.getElementById("statLast").textContent = latest;

  document.getElementById("kpiTotal").textContent = String(total).padStart(3, "0");
  document.getElementById("kpiMonth").textContent = "+" + thisMonth;
  document.getElementById("kpiTags").textContent = String(tagSet.size).padStart(2, "0");
  document.getElementById("kpiLatest").textContent = latest;
}

function renderGrid() {
  const filtered = allReports.filter(r => {
    const tagMatch = activeTag === "all" || (r.tags || []).includes(activeTag);
    const kw = searchKeyword.toLowerCase().trim();
    const kwMatch = !kw ||
      r.title.toLowerCase().includes(kw) ||
      (r.summary || "").toLowerCase().includes(kw) ||
      (r.tags || []).some(t => t.toLowerCase().includes(kw));
    return tagMatch && kwMatch;
  });

  document.getElementById("stats").innerHTML =
    `<span>&gt;&gt; SHOWING <strong>${String(filtered.length).padStart(3, "0")}</strong> / ${String(allReports.length).padStart(3, "0")} RECORDS` +
    (activeTag !== "all" ? ` · FILTER: <strong>${tagLabels[activeTag] || activeTag.toUpperCase()}</strong>` : "") +
    (searchKeyword ? ` · QUERY: <strong>"${searchKeyword}"</strong>` : "") +
    `</span><span class="mono">SORT: DATE DESC</span>`;

  const grid = document.getElementById("grid");
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">&gt;&gt; NO MATCHING RECORDS</div>';
    return;
  }

  grid.innerHTML = filtered.map(r => {
    const id = "RRL-" + String(allReports.indexOf(r) + 1).padStart(4, "0");
    return `
    <a class="card" href="reports/${r.file}">
      <div class="top-row">
        <span class="date">${r.date}</span>
        <span class="ticker-id">${id}</span>
      </div>
      <div class="title">${r.title}</div>
      <div class="summary">${r.summary || ""}</div>
      <div class="bottom-row">
        <div class="tags">
          ${(r.tags || []).map(t =>
            `<span class="tag ${t}">${tagLabels[t] || t.toUpperCase()}</span>`
          ).join("")}
        </div>
        <span class="open-arrow">[OPEN →]</span>
      </div>
    </a>
  `;}).join("");
}

document.getElementById("search").addEventListener("input", e => {
  searchKeyword = e.target.value;
  renderGrid();
});

loadReports();
</script>

</body>
</html>
